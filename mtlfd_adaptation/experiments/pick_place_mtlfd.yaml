# OSVI-AWDA training config adapted to the Multi-Task-LFD-Training-Framework's
# human_rgb_pick_place / ur5e_pick_place dataset (see docs/02_training_adaptation.md).
# Derived from osvi-awda/experiments/pick_place_simple.yaml; the `policy` block (model
# architecture/hyperparameters) is unchanged from the paper's own pick-and-place config.
# `dataset` and the top-level `image_waypoints` flag are the only parts that differ.

batch_size: 30
lr: 0.0005
batches: 20000        # bounded budget (paper's own no-AD ablation already gets .98 on pick-place)
loader_workers: 10
save_freq: 2000
log_freq: 20
img_log_freq: 500
goal_loss: False
waypoints: true
save_optim: True
image_waypoints: False   # predict raw 3D ee-space waypoints; no target-dataset camera calibration
                          # is available, and paper's own ablation shows this doesn't hurt pick-place
mixup: True               # Asymmetric Demonstration Mixup (paper section IV-B)

dataset:
  type: "mtlfd agent teacher"
  root_dir: ${EXPERT_DATA}
  task_name: pick_place
  agent_name: ur5e
  demo_name: human_rgb
  train_tasks: [1, 2, 3, 4, 6, 7, 8, 9, 11, 12, 13, 14, 15]   # matches the convention already used
                                  # throughout Multi-Task-LFD-Training-Framework's pick_place configs
  test_tasks: [0, 5, 10, 15]   # held-out subtasks, matches the convention already used
                                  # throughout Multi-Task-LFD-Training-Framework's pick_place configs
  T_context: 10
  agent_context: 0
  T_pair: 1
  height: 100
  width: 180
  crop: [20, 25, 80, 75]
  demo_crop: [0, 30, 140, 120] 
  rand_flip: True
  flip_sync: True
  rand_crop: [12, 16]
  rand_translate: [12, 16]
  color_jitter: [0.1, 0.1, 0.1] #[0.4, 0.4, 0.4]
  sample_sides: True
  extra_samp_bound: 0.4
  waypoints: True
  grasp: True

policy:
  latent_dim: 60
  lstm_config:
    out_dim: 40
    n_layers: 1
    is_rnn: False
  vis:
    st_goal_attn: True
    n_st_attn: 2
    use_pe: True
    attn_heads: 4
    normalize: False
  n_mixtures: 2
  const_var: True
  concat_state: False
  pred_point: True
  waypoints: 5
  sub_waypoints: True
  grasp: True
