# Duplicate of pick_place_simple_test14_15.yaml (same paper-faithful protocol: 14 train / 2->4
# test tasks here, batches: 500000) but held-out tasks are 0/5/10/15 instead of 14/15 - matches
# the mtlfd-adaptation side's pick_place_mtlfd_heldout_0_5_10_15_imgwp*.yaml split for a direct
# baseline-vs-adaptation comparison on the SAME held-out tasks. Per task_id = object_id*4 + bin_id
# (see baseline_eval/panda_video_heatmap.py's ITEM_NAMES/task_label): 0=milk_bin0, 5=bread_bin1,
# 10=cereal_bin2, 15=can_bin3 - one bin held out per object, not a whole-object holdout.
batch_size: 30
lr: 0.0005
epochs: 2000
batches: 500000
loader_workers: 10
save_freq: 10000
goal_loss: False
waypoints: true
save_optim: True
image_waypoints: True
mixup: True

dataset:
  type: "agent teacher"
  agent_dir: ${EXPERT_DATA}/panda/*.pkl
  teacher_dir: ${EXPERT_DATA}/sawyer/*.pkl
  train_tasks: [1, 2, 3, 4, 6, 7, 8, 9, 11, 12, 13, 14]
  test_tasks: [0, 5, 10, 15]
  T_context: 10
  agent_context: 0
  T_pair: 1
  height: 240
  width: 320
  rand_flip: True
  flip_sync: True
  crop: [100, 0, 0, 0]
  rand_crop: [12, 16]
  rand_translate: [12, 16]
  color_jitter: [0.4, 0.4, 0.4]
  sample_sides: True
  state_spec: []
  extra_samp_bound: 0.4
  traj_per_task: 100
  target_vid: True
  randomize_vid_frames: True
  waypoints: True

policy:
  latent_dim: 60
  lstm_config:
    out_dim: 40
    n_layers: 1
    is_rnn: False
  vis:
    st_goal_attn: True
    n_st_attn: 2
    use_pe: True
    attn_heads: 4
    normalize: False
  n_mixtures: 2
  const_var: True
  concat_state: False
  pred_point: True
  waypoints: 5
  sub_waypoints: True
  grasp: True
